<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>OpenPlay 播放器</title>

    <!-- 优化7: DNS预解析和预连接 - 加速资源加载 -->
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="//unpkg.com">
    <link rel="preconnect" href="//cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="//unpkg.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/logo-black.png">
    <link rel="manifest" href="manifest.json">

    <!-- 关键CSS内联 - 防止样式闪烁(FOUC) -->
    <style>
        /* 基础样式 */
        body { background: #000; color: #fff; margin: 0; font-family: system-ui; }
        .page-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); min-height: 100vh; }

        /* 加载遮罩 - 防止FOUC */
        #style-loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        #style-loader::after { content: ''; width: 40px; height: 40px; border: 3px solid #333; border-top-color: #00ccff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 首屏关键元素样式 */
        .flex { display: flex; } .items-center { align-items: center; } .border-b { border-bottom-width: 1px; }
        .border-\[\#333\] { border-color: #333; } .p-4 { padding: 1rem; } .gap-2 { gap: 0.5rem; }
        .min-w-0 { min-width: 0; } .cursor-pointer { cursor: pointer; } .rounded-lg { border-radius: 0.5rem; }
    </style>

    <script src="libs/tailwindcss.min.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/mobile-optimize.css">
    <link rel="stylesheet" href="css/performance-optimize.css">

    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <!-- 加载遮罩 - Tailwind加载完成后自动移除 -->
    <div id="style-loader"></div>
    <script>
        // 隐藏首屏加载遮罩（多路兜底，避免因 load 事件延迟导致遮罩长时间停留）
        function hideStyleLoader() {
            var loader = document.getElementById('style-loader');
            if (loader) loader.style.display = 'none';
        }
        window.addEventListener('load', function() {
            setTimeout(hideStyleLoader, 100);
        });
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(hideStyleLoader, 500);
        });
        setTimeout(hideStyleLoader, 3000); // 极端兜底：3 秒后无条件隐藏
    </script>
    <header class="player-header-fixed p-4 flex items-center border-b border-[#333] gap-2">
        <div class="flex items-center min-w-0">
            <button id="homeButton" type="button" class="flex items-center min-w-0 cursor-pointer home-button">
                <svg class="w-8 h-8 mr-2 text-[#00ccff] logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <h1 class="text-xl font-bold gradient-text logo-text">OpenPlay</h1>
            </button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center min-w-0">
            <h2 id="videoTitle" class="text-xl font-semibold min-w-0 overflow-x-auto whitespace-nowrap truncate custom-title-scroll"></h2>
            <span class="text-gray-400 text-xs whitespace-nowrap flex-shrink-0 mt-0.5" id="episodeInfo">加载中...</span>
        </div>
        <a href="#" id="goBack" onclick="goBack(event)" class="px-4 py-2 bg-[#222] hover:bg-[#333] border border-[#333] rounded-lg transition-colors flex items-center min-w-0 home-btn">
            <svg class="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                <path d="M5.25 11h15a1.5 1.5 0 1 1 0 3H5.25a1.5 1.5 0 0 1 0-3z"/>
                <path d="M5.55 12 11.3 17.3a1.5 1.5 0 1 1-2.12 2.12L3 12l6.18-6.18a1.5 1.5 0 1 1 2.12 2.12L5.55 12z"/>
            </svg>
            <span class="home-btn-text">上一页</span>
        </a>
    </header>

    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[65] transition-opacity duration-300">
        <div class="bg-[#111] p-8 rounded-lg w-11/12 max-w-md border border-[#333] max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 class="text-2xl font-bold gradient-text">访问验证</h2>
            </div>
            <div class="mb-6">
                <p class="text-gray-300 mb-4">请输入密码继续访问</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="w-full bg-[#111] border border-[#333] text-white px-4 py-3 rounded-lg focus:outline-none focus:border-white transition-colors" placeholder="密码..." autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">提交</button>
                </form>
                <p id="passwordError" class="text-red-500 mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4 py-4">
        <div class="player-layout" id="playerLayout">
        <!-- 左栏：视频播放区 -->
        <div class="player-layout-main">
        <div id="playerContainer" class="player-container mb-4">
            <div class="relative">
                <div id="player" class="player-placeholder"></div>

                <!-- 广告过滤统计（轻量胶囊，播放开始时显示于播放器上方中间，5秒后自动消失） -->
                <div id="adFilterStats" class="absolute top-2 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1.5 px-3 py-1.5 bg-black/70 backdrop-blur-sm rounded-full border border-[#333] shadow-lg pointer-events-none">
                    <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-green-400 font-bold text-sm" id="adFilterCount">0</span>
                    <span class="text-gray-300 text-xs">个广告已过滤</span>
                </div>

                <div class="error-container" id="error">
                    <div class="error-icon">⚠️</div>
                    <div id="error-message">视频加载失败</div>
                    <div class="error-message-sub">请尝试其他视频源或稍后重试</div>
                </div>
            </div>

            <!-- 快捷键提示：置于播放器容器内，随播放器上方居中定位 -->
            <div class="shortcut-hint" id="shortcutHint">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span id="shortcutText"></span>
            </div>
        </div>
        </div>

        <!-- 右栏：可折叠侧边面板（桌面端分栏，移动端保持纵向堆叠） -->
        <aside class="player-sidebar" id="playerSidebar">
            <!-- 收起状态时的把手：点击任意位置展开 -->
            <div id="sidebarHandle" class="player-sidebar-handle" onclick="togglePlayerSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
            </div>
            <div class="player-sidebar-body">
                <!-- 顶部收起按钮（仅桌面端分栏时显示） -->
                <button type="button" id="sidebarToggle" class="player-sidebar-toggle" title="收起面板" aria-label="收起面板" onclick="togglePlayerSidebar()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                    <span>收起</span>
                </button>
                <!-- 移动端 Tab 栏（选集/视频源，仅移动端显示；桌面端由 CSS 隐藏） -->
                <div id="mobilePanelTabs">
                    <button id="mobileTabEpisodes" type="button" class="mobile-tab is-tab-active" data-tab="episodes">选集</button>
                    <button id="mobileTabResources" type="button" class="mobile-tab" data-tab="resources">视频源</button>
                </div>
                <!-- 选集模块：标题行（自动连播/排序）+ 集数网格，合并为一个带边框容器 -->
                <div class="player-container is-tab-active" id="episodesGridContainer">
                    <div class="player-sidebar-header">
                        <!-- 左侧：选集标题（与资源面板信息条对齐方式一致） -->
                        <div class="resource-info-bar-left flex">
                            <span class="player-sidebar-title">选集</span>
                        </div>
                        <!-- 集数分页控件（靠右） -->
                        <div class="panel-pagination">
                            <button type="button" class="panel-scroll-btn" id="episodePagePrev" title="上一页" aria-label="上一页">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <span id="episodePageInfo" class="panel-page-info">-</span>
                            <button type="button" class="panel-scroll-btn" id="episodePageNext" title="下一页" aria-label="下一页">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    </div>
                    <!-- 内容第一行：自动连播 + 排序（固定，不随集数网格滚动，REV-003） -->
                    <div class="flex items-center gap-2 mb-2 flex-wrap episode-toolbar">
                        <div class="flex items-center gap-1 flex-shrink-0" id="autoplayContainer">
                            <span class="text-gray-400 text-sm whitespace-nowrap">自动连播</span>
                            <label class="switch">
                                <input type="checkbox" id="autoplayToggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <button onclick="toggleEpisodeOrder()" class="px-2 py-1 bg-[#222] hover:bg-[#333] border border-[#333] rounded-lg transition-colors flex items-center space-x-1 flex-shrink-0 ml-auto">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" id="orderIcon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd" />
                            </svg>
                            <span id="orderText">倒序排列</span>
                        </button>
                    </div>
                    <div class="episode-grid" id="episodesGrid">
                        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2" id="episodesList">
                            <!-- 集数将在这里动态加载 -->
                            <div class="col-span-full text-center text-gray-400 py-8">加载中...</div>
                        </div>
                    </div>
                </div>

                <!-- 切换资源模块：标题行（当前资源 + 分页）+ 其他视频源列表，与选集模块同为带边框容器 -->
                <div class="resource-module">
                    <div class="player-container resource-info-bar flex justify-between items-center" id="resourceInfoBarContainer">
                        <!-- 当前资源名 + 剧集数 + 分页控件（JS 渲染） -->
                    </div>
                    <div class="player-container resource-switch-list" id="resourceSwitchList">
                        <!-- 其他视频源卡片（分页渲染，异步加载） -->
                    </div>
                </div>
            </div>
        </aside>
        </div>
    </main>

    <!-- 弹框遮罩层 -->
    <div id="panelOverlay" class="panel-overlay" aria-hidden="true"></div>

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[10001]">
        <div class="bg-[#111] p-8 rounded-lg border border-[#333] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js" defer></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;

        // 创建全局环境变量对象（必须在所有 defer 脚本之前设置）
        window.__ENV__ = window.__ENV__ || {};

        // 注入服务器端环境变量 (将由服务器端替换)
        // PASSWORD 变量将在这里被服务器端注入
        window.__ENV__.PASSWORD = "{{PASSWORD}}";
    </script>

    <script src="libs/hls.min.js" crossorigin="anonymous" defer></script>
    <script src="libs/artplayer.min.js" crossorigin="anonymous" defer></script>

    <script src="js/utils.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/proxy-auth.js" defer></script>
    <script src="js/customer_site.js" defer></script>
    <script src="js/password.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/mobile-panel-tabs.js" defer></script>
    <script src="js/mobile-panel-gestures.js" defer></script>

    <script>
        // 修复 home 跳转
        document.addEventListener('DOMContentLoaded', function() {
            // 使用事件委托处理首页按钮点击
            document.body.addEventListener('click', function(event) {
                const homeButton = event.target.closest('#homeButton');
                if (homeButton) {
                    event.preventDefault();
                    event.stopPropagation();

                    // 如果是在iframe中打开的，尝试关闭iframe
                    if (window.self !== window.top) {
                        try {
                            // 尝试调用父窗口的关闭播放器函数
                            window.parent.closeVideoPlayer && window.parent.closeVideoPlayer(true);
                            return;
                        } catch (e) {
                            console.error('调用父窗口closeVideoPlayer失败:', e);
                        }
                    }

                    // 多重兜底跳转
                    try {
                            window.location.href = '/';
                    } catch (e) {
                        try {
                            window.location.replace('/');
                        } catch (e2) {
                            window.location.assign('/');
                    }
                    }
                    return false;
                }
            });
        });
    </script>
</body>
</html>
